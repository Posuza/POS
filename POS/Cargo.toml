[package]
name = "pos-scanner"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Desktop UI
dioxus = { version = "0.5", features = ["desktop"] }
dioxus-router = "0.5"
dioxus-free-icons = { version = "0.8", features = ["font-awesome-solid", "font-awesome-regular"] }

# Local database (SQLite)
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Password hashing
bcrypt = "0.15"

# 📸 IMAGE HANDLING
base64 = "0.21"             # Base64 encoding for images

# Desktop features
gloo-timers = { version = "0.2", features = ["futures"] }  # Async timer for messages

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
